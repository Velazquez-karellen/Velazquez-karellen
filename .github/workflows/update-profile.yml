name: Update ORBIT activity
on:
  workflow_dispatch:
  push:
    branches: [feature/orbit-profile-v1]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/update-profile.yml
  schedule:
    - cron: '25 5 * * *'
concurrency:
  group: orbit-activity-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generator
        run: python -m py_compile scripts/generate_stats.py
      - name: Generate activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_OWNER: Velazquez-karellen
        run: python scripts/generate_stats.py
      - name: Commit activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/components/github-activity.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh ORBIT activity"
            git push
          fi
